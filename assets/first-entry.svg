<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Start with one task you can finish</title>
  <desc id="desc">A cream and ink editorial banner with coral and lime geometric steps. Pick a task, build with AI, submit your work.</desc>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="#f7f2e8" stroke="#bbc1b5" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172d29">
    <text x="42" y="48" font-size="17" font-weight="700" letter-spacing="3">YOUR FIRST MAKE.FUN ENTRY</text>
    <text x="40" y="111" font-size="49" font-weight="700" letter-spacing="-1.5">Start with one task</text>
    <text x="40" y="166" font-size="49" font-weight="700" letter-spacing="-1.5">you can finish.</text>
    <text x="43" y="204" font-size="22">Choose the work. Let AI help. Make it yours.</text>
    <path d="M42 229H1158" stroke="#cbd0c2"/>
    <circle cx="61" cy="270" r="20" fill="#ef896e"/><text x="61" y="276" font-size="17" text-anchor="middle" font-weight="700">1</text>
    <text x="95" y="278" font-size="25" font-weight="700">Pick a task</text>
    <path d="m304 264 8 7-8 7" fill="none" stroke="#657a70" stroke-width="2"/>
    <circle cx="400" cy="270" r="20" fill="#dae99c"/><text x="400" y="276" font-size="17" text-anchor="middle" font-weight="700">2</text>
    <text x="434" y="278" font-size="25" font-weight="700">Build with AI</text>
    <path d="m692 264 8 7-8 7" fill="none" stroke="#657a70" stroke-width="2"/>
    <circle cx="786" cy="270" r="20" fill="#172d29"/><text x="786" y="276" font-size="17" text-anchor="middle" font-weight="700" fill="#f7f2e8">3</text>
    <text x="820" y="278" font-size="25" font-weight="700">Submit your work</text>
  </g>
  <g transform="translate(899 51)">
    <rect width="210" height="150" rx="9" fill="#172d29"/>
    <rect x="17" y="18" width="176" height="13" rx="6" fill="#dae99c"/>
    <path d="M22 58H106M22 78H142M22 98H88" stroke="#f7f2e8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="171" cy="117" r="34" fill="#ef896e"/>
    <path d="m156 117 10 10 20-23" fill="none" stroke="#172d29" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
